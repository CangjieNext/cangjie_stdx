[package]
  cjc-version = "1.1.0"
  name = "net"
  organization = "cangjie_stdx"
  description = "nothing here"
  version = "1.0.0"
  target-dir = ""
  script-dir = ""
  output-type = "dynamic"
  compile-option = "-O2"
  override-compile-option = ""
  link-option = ""
  package-configuration = {}
  src-dir = "./src"
  exclude = ["src/http/CMakeLists.txt", "src/tls/CMakeLists.txt"]

[package.package-configuration."cangjie_stdx::net.tls"]
  compile-option = "-lcangjie-dynamicLoader-opensslFFI -lnet.tlsFFI -lcrypto.keysFFI -lcrypto.x509FFI -ldl"

[dependencies]
  "cangjie_stdx::crypto" = { path = "../crypto" }
  "cangjie_stdx::encoding" = { path = "../encoding" }
  "cangjie_stdx::log" = { path = "../log" }
  "cangjie_stdx::logger" = { path = "../logger" }

[target.x86_64-unknown-linux-gnu]
  link-option = "-L ../../target/linux_ohos_aarch64_cjnative/static/stdx -L ../../target/linux_x86_64_cjnative/static/stdx -L target/linux_ohos_aarch64_cjnative/static/stdx -L target/linux_x86_64_cjnative/static/stdx"

[target.aarch64-unknown-linux-gnu]
  link-option = "-L ../../target/linux_ohos_aarch64_cjnative/static/stdx -L ../../target/linux_aarch64_cjnative/static/stdx -L target/linux_ohos_aarch64_cjnative/static/stdx -L target/linux_aarch64_cjnative/static/stdx -lcangjie-dynamicLoader-opensslFFI -lnet.tlsFFI -lcrypto.keysFFI -lcrypto.x509FFI -ldl"

[target.aarch64-apple-darwin]
  link-option = "-L ../../target/darwin_aarch64_cjnative/static/stdx -L target/darwin_aarch64_cjnative/static/stdx  -lcangjie-dynamicLoader-opensslFFI -lnet.tlsFFI -lcrypto.keysFFI -lcrypto.x509FFI -ldl -undefined suppress -flat_namespace"

[target.x86_64-apple-darwin]
  link-option = "-L ../../target/darwin_x86_64_cjnative/static/stdx -L target/darwin_x86_64_cjnative/static/stdx -undefined suppress -flat_namespace"

[target.x86_64-w64-mingw32]
  link-option = "-L ${LOCALAPPDATA}/stdx/target/release/stdx -lpthread -lws2_32 -lcrypt32"

[target.x86_64-linux-ohos]
  compile-option = "-B \"${DEVECO_CANGJIE_HOME}/build-tools/third_party/llvm/bin\" -B \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/x86_64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/x86_64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/clang/15.0.4/lib/x86_64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/x86_64-linux-ohos\" --sysroot \"${DEVECO_OH_NATIVE_HOME}/sysroot\""

[target.aarch64-linux-ohos]
  compile-option = "-B \"${DEVECO_CANGJIE_HOME}/build-tools/third_party/llvm/bin\" -B \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/clang/15.0.4/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/aarch64-linux-ohos\" --sysroot \"${DEVECO_OH_NATIVE_HOME}/sysroot\""